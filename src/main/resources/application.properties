spring.application.name=SOCISYAMIGOS_BACKEND

# Importar configuracion local si existe (ignorado por Git)
spring.config.import=optional:classpath:application-local.properties

# Configuracion de base de datos Oracle mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuracion JWT
app.jwt-secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt-expiration-milliseconds=${JWT_EXPIRATION_MILLISECONDS:3600000}
